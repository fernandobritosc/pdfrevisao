name: Validate Resumos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate HTML & Add-ons
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git log in build-changelog.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # No external deps needed (stdlib only)

      # Gate de CI: só integridade de HTML (passa nos 79 resumos).
      # O gate completo (fontes, grids, resíduos de migração) tem dívida antiga
      # e roda localmente antes do deploy: python tools/validate-all.py --verbose
      - name: Run validation gate (HTML)
        run: |
          python tools/check-html.py --dir Resumo_estudos --check
        working-directory: ${{ github.workspace }}

      - name: Build search index (verify it works)
        run: |
          python build-search-index.py
        working-directory: ${{ github.workspace }}

      - name: Build changelog (verify it works)
        run: |
          python build-changelog.py
        working-directory: ${{ github.workspace }}

      - name: Upload validation artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-output
          path: |
            Resumo_estudos/search-index.json
            Resumo_estudos/mudancas.html

