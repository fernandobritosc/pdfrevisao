name: CI + Deploy Surge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  build-and-test:
    name: Build + Testes + Validação
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 1. Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build-changelog.py lê o git log completo

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # 3. Instala dependências Python (cssmin, jsmin)
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cssmin jsmin

      # 4. Setup Node.js (para Surge + Playwright)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 6. Instala dependências Node (Surge no deploy-surge usa npx; Playwright NÃO é instalado na CI)
      - name: Install Node dependencies
        run: npm ci

      # A regressão visual (Playwright) NÃO roda na CI — roda localmente na máquina do usuário:
      #   npm install && npx playwright install chromium && npm test
      # (economiza ~1–2 min por merge; ci.yml não executa nenhum teste visual)

      # 7. Pipeline de build (sem deploy — quem publica é o job deploy-surge)
      - name: Run build pipeline
        run: python build.py design template validate index changelog --parallel

      # 8. Valida vocabulário (falha se termos proibidos)
      - name: Validate glossary vocabulary
        run: python tools/check-glossary.py --all --strict

      # 8b. Valida links locais do site (existência + âncoras internas)
      - name: Check links (site)
        run: python tools/check-links.py

      # 9. Site completo (é o que o job de deploy publica)
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: Resumo_estudos
          retention-days: 7

      # 10. Relatórios e snapshots (diagnóstico em caso de falha)
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            tests/snapshots/
            playwright-report/
            test-results/
          retention-days: 7

  deploy-surge:
    name: Deploy no Surge
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: ./site

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy no Surge
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          echo "Deploying to Surge..."
          npx surge ./site ${{ secrets.SURGE_DOMAIN }} --token $SURGE_TOKEN
        shell: bash