name: CI + Deploy Surge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  build-and-test:
    name: Build + Testes + Validação
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 1. Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # 3. Instala dependências Python (cssmin, jsmin)
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cssmin jsmin

      # 4. Setup Node.js (para Surge + Playwright)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 6. Instala dependências Node (Playwright, Surge)
      - name: Install Node dependencies
        run: npm ci

      # 7. Instala browsers Playwright (Chromium + deps)
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # 7. Pipeline completo (build + validação + testes visuais)
      - name: Run build pipeline
        run: python build.py all --parallel

      # 8. Valida vocabulário (falha se termos proibidos)
      - name: Validate glossary vocabulary
        run: python tools/check-glossary.py --all --strict

      # 9. Upload artifacts (template gerado, snapshots, relatórios)
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            Resumo_estudos/templates/template-sumario.html
            tests/snapshots/
            playwright-report/
            test-results/
          retention-days: 7

  deploy-surge:
    name: Deploy no Surge
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ./build-output

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy no Surge
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          echo "Deploying to Surge..."
          npx surge ./build-output/Resumo_estudos ${{ secrets.SURGE_DOMAIN }} --token $SURGE_TOKEN
        shell: bash