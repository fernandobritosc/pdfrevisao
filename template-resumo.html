<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITULO}}</title>
<style>
  :root {
    --sidebar: 260px;
    --accent: #0f172a;
    --accent-soft: #f1f5f9;
    --highlight: #b45309;
    --callout: #fff7ed;
    --callout-border: #f97316;
    --gotcha: #fef2f2;
    --gotcha-border: #ef4444;
    --mnemonic: #f0fdf4;
    --mnemonic-border: #22c55e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.7;
    color: #1f2937;
    background: #ffffff;
    display: flex;
    min-height: 100vh;
  }

  aside {
    width: var(--sidebar);
    background: #0f172a;
    color: #e2e8f0;
    padding: 28px 20px;
    position: fixed;
    height: 100vh;
    overflow-y: auto;
    font-size: 14px;
  }

  aside h3 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 18px;
    color: #fbbf24;
    font-weight: 700;
  }

  aside h4 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin: 24px 0 10px;
    color: #94a3b8;
    font-weight: 600;
  }

  aside a {
    display: block;
    color: #cbd5e1;
    text-decoration: none;
    padding: 7px 10px;
    border-radius: 8px;
    margin-bottom: 3px;
    font-size: 13px;
    transition: background 0.15s ease, color 0.15s ease;
  }

  aside a:hover {
    background: #1e293b;
    color: #fff;
  }

  main {
    margin-left: var(--sidebar);
    flex: 1;
    padding: 36px 44px 56px;
    max-width: 960px;
  }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 18px;
    color: #b45309;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    transition: color 0.15s ease;
  }

  .back:hover {
    color: #0f172a;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  h1 {
    font-size: 32px;
    font-weight: 800;
    color: #0f172a;
    margin-bottom: 10px;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }

  .meta {
    color: #475569;
    font-size: 14px;
    margin-bottom: 28px;
    font-weight: 500;
  }

  h2 {
    font-size: 22px;
    font-weight: 700;
    color: #0f172a;
    margin-top: 40px;
    margin-bottom: 14px;
    padding-left: 14px;
    border-left: 4px solid #f59e0b;
    line-height: 1.25;
  }

  h3 {
    font-size: 18px;
    font-weight: 600;
    color: #1e293b;
    margin-top: 26px;
    margin-bottom: 10px;
  }

  p {
    margin-bottom: 16px;
    text-align: justify;
    color: #1f2937;
  }

  ul {
    margin-left: 24px;
    margin-top: 12px;
    margin-bottom: 16px;
  }

  li {
    margin-bottom: 10px;
    padding-left: 4px;
  }

  .callout {
    background: var(--callout);
    border-left: 4px solid var(--callout-border);
    padding: 18px 20px;
    border-radius: 10px;
    margin: 26px 0;
    font-size: 15px;
  }

  .callout b {
    color: #9a3412;
  }

  .gotcha {
    background: var(--gotcha);
    border-left: 4px solid var(--gotcha-border);
    padding: 18px 20px;
    border-radius: 10px;
    margin: 26px 0;
  }

  .gotcha b {
    color: #991b1b;
  }

  .mnemonic {
    background: var(--mnemonic);
    border-left: 4px solid var(--mnemonic-border);
    padding: 18px 20px;
    border-radius: 10px;
    margin: 26px 0;
  }

  .mnemonic b {
    color: #166534;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 18px;
    font-size: 14px;
  }

  th, td {
    border: 1px solid #e2e8f0;
    padding: 11px 14px;
    text-align: left;
  }

  th {
    background: #f8fafc;
    font-weight: 600;
    color: #0f172a;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  td {
    color: #1f2937;
  }

  .footer {
    margin-top: 56px;
    font-size: 12px;
    color: #64748b;
    border-top: 1px solid #e2e8f0;
    padding-top: 16px;
    font-weight: 500;
  }

  .section {
    margin-bottom: 32px;
  }

  @media (max-width: 768px) {
    aside {
      position: relative;
      width: 100%;
      height: auto;
    }
    main {
      margin-left: 0;
      padding: 24px 20px 40px;
    }
  }
</style>
</head>
<body>
<aside>
  <h3>{{MATERIA}}</h3>
  {{SIDEBAR_NAV}}
  <h4>Nesta aula</h4>
  {{SIDEBAR_TOPICS}}
</aside>
<main>
  <a class="back" href="/PDF%20Revis%C3%A3o/index.html">← Voltar para o índice</a>
  <h1>{{TITULO}}</h1>
  <div class="meta">{{META}}</div>

  {{CALLOUT}}

  {{CONTEUDO}}

  {{FOOTER}}
</main>
</body>
</html>
