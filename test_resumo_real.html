<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Teste Resumo Real</title>
<style>
:root { --mat: #2563eb; --amber: #d97706; --card: #fff; --border: #e2dfd7; --text: #1f2733; --text2: #455064; }
body { font-family: 'IBM Plex Sans', sans-serif; }
.rh-toolbar { position: fixed; right: 1.1rem; bottom: 1.1rem; display: flex; flex-direction: column; gap: .45rem; z-index: 300; }
.rh-toolbar button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid #c9c5ba; background: #fff; cursor: pointer; }
.card { border: 1px solid #e2dfd7; border-radius: 14px; padding: 1rem; margin-bottom: 1rem; }
.card-text { color: #455064; line-height: 1.65; }
.gotcha { border-left: 5px solid #dc2626; background: #fdf1f1; padding: .7rem 1rem; margin: .75rem 0; }
.callout { border: 1px solid #c9c5ba; background: #f0eee7; padding: .75rem 1rem; margin: .8rem 0; }

/* ===== RH modo revisão (active recall) ===== */
html.rh-rev .card-text, html.rh-rev .gotcha, html.rh-rev .callout, html.rh-rev .table-wrap,
html.rh-rev .mnemonic-content, html.rh-rev .question-text, html.rh-rev .answer { display: none; }
html.rh-rev .card, html.rh-rev .gotcha, html.rh-rev .callout, html.rh-rev .table-wrap,
html.rh-rev .mnemonic, html.rh-rev .question { cursor: pointer; }
html.rh-rev .card.rev-open .card-text, html.rh-rev .gotcha.rev-open, html.rh-rev .callout.rev-open,
html.rh-rev .table-wrap.rev-open, html.rh-rev .mnemonic.rev-open .mnemonic-content,
html.rh-rev .question.rev-open .question-text, html.rh-rev .question.rev-open .answer { display: block; }
html.rh-rev .card.rev-open, html.rh-rev .gotcha.rev-open { border-color: var(--amber); }
.rh-toolbar button.on { border-color: var(--amber); background: #fdf3d8; }
html[data-theme="dark"] .rh-toolbar button.on { background: #33290f; border-color: #6e5a1e; }
</style>
</head>
<body class="aula">
<div class="rh-toolbar" role="group" aria-label="Ferramentas de leitura">
  <button type="button" id="rhTheme" title="Modo claro/escuro" aria-label="Alternar modo claro/escuro">🌙</button>
  <button type="button" id="rhFontMinus" title="Diminuir fonte" aria-label="Diminuir tamanho da fonte">A−</button>
  <button type="button" id="rhFontPlus" title="Aumentar fonte" aria-label="Aumentar tamanho da fonte">A+</button>
  
  <button type="button" id="rhTop" title="Voltar ao topo" aria-label="Voltar ao topo" hidden>↑</button><button type="button" id="rhRev" title="Modo revisão: oculte e se auto-teste" aria-label="Alternar modo revisão" aria-pressed="false">🧠</button>
</div>
<script>
(function(){
  var root=document.documentElement;
  var bT=document.getElementById('rhTheme'),bM=document.getElementById('rhFontMinus'),
      bP=document.getElementById('rhFontPlus'),bTop=document.getElementById('rhTop');
  function icon(){bT.textContent=root.getAttribute('data-theme')==='dark'?'☀️':'🌙';}
  bT.addEventListener('click',function(){var t=root.getAttribute('data-theme')==='dark'?'light':'dark';root.setAttribute('data-theme',t);try{localStorage.setItem('rh-theme',t);}catch(e){}icon();});
  icon();
})();
</script>

<script id="rh-rev">
(function(){
  var b=document.getElementById('rhRev'); if(!b) return;
  var root=document.documentElement;
  function on(){return root.classList.contains('rh-rev');}
  function apply(){
    var now=!on();
    root.classList.toggle('rh-rev', now);
    b.classList.toggle('on', now);
    try{localStorage.setItem('rh-rev', now?'1':'0');}catch(e){}
    b.setAttribute('aria-pressed', now?'true':'false');
  }
  b.addEventListener('click', apply);
  try{ if(localStorage.getItem('rh-rev')==='1') apply(); }catch(e){}
  document.addEventListener('click', function(ev){
    if(!on()) return;
    var el = ev.target && ev.target.closest ? ev.target.closest('.card,.gotcha,.callout,.table-wrap,.mnemonic,.question') : null;
    if(!el || ev.target.closest('a')) return;
    el.classList.toggle('rev-open');
  });
})();
</script><!--/rh:ui-->
<main class="main">
<section id="sec1">
  <div class="sec-header"><div class="sec-num">1</div><div class="sec-title">Introdução</div></div>
  <div class="card">
    <div class="card-title">Conceito</div>
    <div class="card-text">Conteúdo da aula.</div>
  </div>
  <div class="gotcha"><div class="gotcha-title">🚨 Pegadinha</div>Cuidado com isso.</div>
  <div class="callout callout-info"><div class="callout-icon">ℹ️</div><div>Info adicional.</div></div>
</section>
</main>
</body>
</html>
